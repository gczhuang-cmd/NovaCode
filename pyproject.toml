[project]
name = "novacode"
version = "0.1.0"
description = "多协议 LLM 终端对话客户端"
requires-python = ">=3.12"
dependencies = [
  "rich>=13",
  "anthropic>=0.40",
  "openai>=1.50",
  "pyyaml>=6",
  "prompt-toolkit>=3.0.53",
  "mcp>=2.0.0",
  "httpx>=0.27",
]

[project.scripts]
novacode = "novacode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novacode"]
include = ["src/novacode/skills/builtin/**/SKILL.md"]  # 内置 Skill 资源随 wheel 分发（ch11 T5）

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
